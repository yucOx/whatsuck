<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Own green gradient (distinct from WhatsApp's flat #25D366) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c081"/>
      <stop offset="1" stop-color="#0c7a4d"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="8" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded-square tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#hi)"/>

  <!-- Speech bubble: rounded body + tail, white -->
  <g filter="url(#shadow)">
    <rect x="296" y="300" width="432" height="360" rx="84" ry="84" fill="#ffffff"/>
    <polygon points="388,652 348,744 452,660" fill="#ffffff"/>
  </g>

  <!-- "W" glyph: a single bold stroked polyline -->
  <polyline
    points="404,408 444,592 512,470 580,592 620,408"
    fill="none" stroke="#0c7a4d" stroke-width="56"
    stroke-linejoin="round" stroke-linecap="round"/>
</svg>